services:
  db:
    image: postgres:16-alpine
    container_name: olivet_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-olivet_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-olivet_records}
      APP_POSTGRES_USER: ${APP_POSTGRES_USER:-olivet_runtime}
      APP_POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-olivet_app} -d ${POSTGRES_DB:-olivet_records}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: olivet_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
